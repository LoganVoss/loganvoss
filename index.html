<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Logan Voss</title>
<meta name="description" content="Logan Voss — apps, photography, music and more. An iPhone you can play with.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Logan Voss">
<meta property="og:title" content="Logan Voss">
<meta property="og:description" content="Apps, photography, music and more — an iPhone you can play with.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.loganvoss.com">
<meta property="og:image" content="https://www.loganvoss.com/assets/wallpaper.jpg">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preload" as="image" href="assets/wallpaper.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gradPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6DE96A"/><stop offset="1" stop-color="#2ECB3F"/>
    </linearGradient>
    <linearGradient id="gradMsg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E15D"/><stop offset="1" stop-color="#26CE3E"/>
    </linearGradient>
    <linearGradient id="gradMail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4AA8F8"/><stop offset="1" stop-color="#1E7CF4"/>
    </linearGradient>
    <linearGradient id="gradMusic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F2F7"/>
    </linearGradient>
    <linearGradient id="gradMusicWidget" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FC3C44"/><stop offset="1" stop-color="#C724B1"/>
    </linearGradient>
  </defs>

  <symbol id="i-apple" viewBox="0 0 24 24">
    <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
  </symbol>

  <symbol id="i-bars" viewBox="0 0 22 12">
    <rect x="0"    y="8.5"  width="3" height="3.5"  rx="1.1"/>
    <rect x="4.5"  y="6.5"  width="3" height="5.5"  rx="1.1"/>
    <rect x="9"    y="4.5"  width="3" height="7.5"  rx="1.1"/>
    <rect x="13.5" y="2.5"  width="3" height="9.5"  rx="1.1"/>
    <rect x="18"   y="0.5"  width="3" height="11.5" rx="1.1"/>
  </symbol>

  <symbol id="i-wifi" viewBox="0 0 16 12">
    <path d="M1.6 4.6a10 10 0 0 1 12.8 0" fill="none" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M4.1 7.2a6.1 6.1 0 0 1 7.8 0" fill="none" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="8" cy="10" r="1.5"/>
  </symbol>

  <symbol id="i-battery" viewBox="0 0 27 13">
    <rect x="0.7" y="0.7" width="22" height="11.6" rx="3.6" fill="none" stroke-width="1.1" opacity="0.45"/>
    <rect x="2.6" y="2.6" width="14.5" height="7.8" rx="1.9"/>
    <path d="M24.6 4.4v4.2a2.3 2.3 0 0 0 0-4.2z" opacity="0.45"/>
  </symbol>

  <symbol id="i-phone" viewBox="0 0 60 60">
    <rect width="60" height="60" rx="13.5" fill="url(#gradPhone)"/>
    <path fill="#fff" transform="translate(10.4,10.4) scale(1.64)" d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
  </symbol>

  <symbol id="i-msg" viewBox="0 0 60 60">
    <rect width="60" height="60" rx="13.5" fill="url(#gradMsg)"/>
    <ellipse cx="30" cy="27.5" rx="17.5" ry="13.5" fill="#fff"/>
    <path d="M19.5 37.5c-.8 4.2-3.4 7.4-7.5 9 3.4.1 7-.9 9.6-3.1z" fill="#fff"/>
  </symbol>

  <symbol id="i-mail" viewBox="0 0 60 60">
    <rect width="60" height="60" rx="13.5" fill="url(#gradMail)"/>
    <rect x="12" y="18" width="36" height="25" rx="3.2" fill="#fff"/>
    <path d="M13.5 20.5 30 33.5 46.5 20.5" fill="none" stroke="#2E88F6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-music" viewBox="0 0 60 60">
    <rect width="60" height="60" rx="13.5" fill="url(#gradMusic)"/>
    <g fill="#FC3C44">
      <rect x="23" y="16.5" width="3.1" height="22" rx="0.6"/>
      <rect x="41.5" y="12.5" width="3.1" height="22" rx="0.6"/>
      <path d="M23 16.8c7-1.2 14.5-2.6 21.6-4.6v6.4c-7.1 2-14.6 3.4-21.6 4.6z"/>
      <ellipse cx="20.2" cy="39.5" rx="5.4" ry="4.1" transform="rotate(-16 20.2 39.5)"/>
      <ellipse cx="38.7" cy="35.5" rx="5.4" ry="4.1" transform="rotate(-16 38.7 35.5)"/>
    </g>
  </symbol>

  <symbol id="i-camera" viewBox="0 0 60 60">
    <g fill="#fff">
      <path d="M21.5 20l2.6-3.4c.5-.6 1.2-1 2-1h7.8c.8 0 1.5.4 2 1L38.5 20H42a6 6 0 0 1 6 6v13a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z"/>
      <circle cx="30" cy="32.5" r="6.4" fill="none" stroke="#8e8e93" stroke-width="2.6"/>
    </g>
  </symbol>

  <symbol id="i-torch" viewBox="0 0 60 60">
    <g fill="#fff">
      <rect x="21" y="12" width="18" height="6.5" rx="3.2"/>
      <path d="M23.5 20.5h13l-2.6 7.5v13.2a3.9 3.9 0 0 1-7.8 0V28z"/>
    </g>
  </symbol>

  <symbol id="i-note" viewBox="0 0 60 60">
    <g fill="#fff">
      <rect x="23" y="16.5" width="3.1" height="22" rx="0.6"/>
      <rect x="41.5" y="12.5" width="3.1" height="22" rx="0.6"/>
      <path d="M23 16.8c7-1.2 14.5-2.6 21.6-4.6v6.4c-7.1 2-14.6 3.4-21.6 4.6z"/>
      <ellipse cx="20.2" cy="39.5" rx="5.4" ry="4.1" transform="rotate(-16 20.2 39.5)"/>
      <ellipse cx="38.7" cy="35.5" rx="5.4" ry="4.1" transform="rotate(-16 38.7 35.5)"/>
    </g>
  </symbol>

  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M8.5 4.5 16 12l-7.5 7.5" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-pin" viewBox="0 0 24 24">
    <path d="M12 22s7.5-6.6 7.5-12A7.5 7.5 0 0 0 4.5 10c0 5.4 7.5 12 7.5 12z" fill="none" stroke-width="1.8"/>
    <circle cx="12" cy="10" r="2.6" fill="none" stroke-width="1.8"/>
  </symbol>
</svg>

<div class="stage" id="stage">
  <div class="phone" id="phone">
    <div class="screen" id="screen">
      <div class="wallpaper" id="wallpaper"></div>

      <!-- HOME SCREEN -->
      <section class="home" id="home" aria-label="Home screen">
        <header class="statusbar">
          <div class="sb-left"><span class="sb-time" id="sbTime">11:11</span></div>
          <div class="sb-right">
            <svg class="sb-ic"><use href="#i-bars"/></svg>
            <svg class="sb-ic wifi"><use href="#i-wifi"/></svg>
            <svg class="sb-ic batt"><use href="#i-battery"/></svg>
          </div>
        </header>
        <div class="pages" id="pages">
          <div class="pages-track" id="pagesTrack"></div>
        </div>
        <div class="dots" id="dots"></div>
        <footer class="dock">
          <a class="app dock-app" href="tel:7148518455" aria-label="Call Logan">
            <span class="app-icon"><svg viewBox="0 0 60 60"><use href="#i-phone"/></svg></span>
          </a>
          <a class="app dock-app" href="imessage://714-851-8455" aria-label="Message Logan">
            <span class="app-icon"><svg viewBox="0 0 60 60"><use href="#i-msg"/></svg></span>
          </a>
          <a class="app dock-app" href="mailto:LoganVoss714@gmail.com" aria-label="Email Logan">
            <span class="app-icon"><svg viewBox="0 0 60 60"><use href="#i-mail"/></svg></span>
          </a>
          <a class="app dock-app" href="https://music.apple.com/us/artist/deltax/1620112963" target="_blank" rel="noopener" aria-label="DeltaX on Apple Music">
            <span class="app-icon"><svg viewBox="0 0 60 60"><use href="#i-music"/></svg></span>
          </a>
        </footer>
        <div class="home-indicator dark"></div>
      </section>

      <!-- CALENDAR APP -->
      <section class="calapp" id="calApp" aria-label="Calendar">
        <div class="cal-head">
          <div class="cal-year" id="calYear">2026</div>
          <div class="cal-title-row">
            <h1 id="calMonth">August</h1>
            <div class="cal-nav">
              <button id="calPrev" aria-label="Previous month"><svg><use href="#i-chev-l"/></svg></button>
              <button id="calNext" aria-label="Next month"><svg><use href="#i-chev-r"/></svg></button>
            </div>
          </div>
          <div class="cal-dow-row">
            <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-events">
          <div class="cal-events-title">Upcoming</div>
          <div class="cal-event">
            <div class="cal-event-date"><span class="ce-mon">SEP</span><span class="ce-day">29</span></div>
            <div class="cal-event-info">
              <div class="ce-name">OpenAI Dev Day</div>
              <div class="ce-meta">Tuesday &middot; 10:00 AM</div>
              <div class="ce-meta loc"><svg><use href="#i-pin"/></svg>San Francisco, California</div>
            </div>
            <div class="ce-count" id="ceCount">48d</div>
          </div>
        </div>
        <button class="cal-home" id="calClose" aria-label="Close Calendar">
          <div class="home-indicator dark"></div>
        </button>
      </section>

      <!-- LOCK SCREEN -->
      <section class="lock" id="lock" aria-label="Lock screen">
        <header class="statusbar">
          <div class="sb-left carrier">
            <span class="carrier-name">Voss</span>
            <svg class="sb-ic"><use href="#i-bars"/></svg>
            <svg class="sb-ic wifi"><use href="#i-wifi"/></svg>
          </div>
          <div class="sb-right">
            <svg class="sb-ic batt"><use href="#i-battery"/></svg>
          </div>
        </header>
        <div class="lock-top">
          <div class="lock-date" id="lockDate">Wednesday, August 12</div>
          <div class="lock-time" id="lockTime">11:11</div>
        </div>
        <div class="notifications" id="notifications">
          <button class="notif" id="notifMsg">
            <span class="notif-icon"><svg viewBox="0 0 60 60"><use href="#i-msg"/></svg></span>
            <span class="notif-body">
              <span class="notif-top"><span class="notif-app">MESSAGES</span><span class="notif-when">now</span></span>
              <span class="notif-title">Logan Voss</span>
              <span class="notif-text">Hey, nice to see you. ;)</span>
            </span>
          </button>
          <button class="notif" id="notifCal">
            <span class="notif-icon cal-mini"><span class="cal-mini-dow" id="miniDow">WED</span><span class="cal-mini-day" id="miniDay">12</span></span>
            <span class="notif-body">
              <span class="notif-top"><span class="notif-app">CALENDAR</span><span class="notif-when" id="calCountNotif">in 48d</span></span>
              <span class="notif-title">OpenAI Dev Day</span>
              <span class="notif-text">Sep 29 &middot; San Francisco, California</span>
            </span>
          </button>
        </div>
        <div class="lock-bottom">
          <button class="lock-round" id="flashlight" aria-label="Flashlight"><svg viewBox="0 0 60 60"><use href="#i-torch"/></svg></button>
          <button class="lock-round" id="lockCamera" aria-label="Camera"><svg viewBox="0 0 60 60"><use href="#i-camera"/></svg></button>
        </div>
        <div class="swipe-zone">
          <div class="swipe-hint" id="swipeHint">Swipe up to open</div>
          <div class="home-indicator light"></div>
        </div>
      </section>

      <!-- BOOT -->
      <section class="boot" id="boot" aria-label="Starting up">
        <svg class="boot-logo" viewBox="0 0 24 24"><use href="#i-apple"/></svg>
        <div class="boot-track"><div class="boot-fill" id="bootFill"></div></div>
      </section>

      <div class="island" id="island"></div>
      <div class="flash-overlay" id="flashOverlay"></div>
    </div>
    <img class="bezel" src="assets/bezel.png" alt="" draggable="false">
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
